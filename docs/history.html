<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History & Statistics - Typing Practice</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="history-page">
  <div class="theme-toggle">
    <button id="themeToggle" class="icon-btn" title="Toggle Theme">
      <span class="theme-icon">🌙</span>
    </button>
  </div>

  <main class="container">
    <div class="page-header">
      <a href="index.html" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Home
      </a>
      <h2>History & Statistics</h2>
    </div>

    <!-- Stats Overview -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="stat-card-value" id="statAvgWpm">0</div>
        <div class="stat-card-label">Average WPM</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-card-value" id="statHighestWpm">0</div>
        <div class="stat-card-label">Highest WPM</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statHighestAccuracy">0%</div>
        <div class="stat-card-label">Highest Accuracy</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statAvgAccuracy">0%</div>
        <div class="stat-card-label">Average Accuracy</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statLongestTest">0s</div>
        <div class="stat-card-label">Longest Test</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statTotalTime">0 min</div>
        <div class="stat-card-label">Total Practice Time</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statTotalWords">0</div>
        <div class="stat-card-label">Total Words Typed</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value" id="statTotalChars">0</div>
        <div class="stat-card-label">Total Characters</div>
      </div>
    </div>

    <!-- Test History Table -->
    <div class="card">
      <div class="card-header">
        <h3>Test History</h3>
        <div class="card-actions">
          <button id="refreshHistory" class="btn btn-sm btn-secondary">Refresh</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="history-table" id="historyTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Duration</th>
              <th>WPM</th>
              <th>Accuracy</th>
              <th>Words</th>
              <th>Rating</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="8" class="text-center text-muted">No test history yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal-overlay" style="display:none;">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>Test Details</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="detailBody">
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
