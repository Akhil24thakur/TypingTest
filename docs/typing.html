<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Test - Typing Practice</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="typing-page">
  <main class="typing-container">
    <!-- Countdown Overlay -->
    <div id="countdownOverlay" class="overlay">
      <div class="countdown-content">
        <div id="countdownNumber" class="countdown-number">3</div>
        <p class="countdown-label">Get ready...</p>
      </div>
    </div>

    <!-- Disclaimer -->
    <div class="typing-disclaimer">
      <span class="disclaimer-icon">⚡</span>
      Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> when done to finish the test and see your results
    </div>

    <!-- Top Bar -->
    <div class="typing-topbar">
      <div class="topbar-left">
        <button id="pauseBtn" class="btn btn-sm btn-secondary" title="Pause (Esc)" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          Pause
        </button>
        <button id="resumeBtn" class="btn btn-sm btn-primary" title="Resume" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Resume
        </button>
        <button id="finishBtn" class="btn btn-sm btn-danger" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Finish Test
        </button>
      </div>
      <div class="topbar-center">
        <div class="timer-display" id="timerDisplay">00:00</div>
      </div>
      <div class="topbar-right">
        <div class="stat-badge">
          <span class="stat-label">Timer</span>
          <span id="timerMode" class="stat-value">Unlimited</span>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="typing-stats" id="typingStats" style="display:none;">
      <div class="stat-item">
        <span class="stat-label">WPM</span>
        <span class="stat-value" id="liveWpm">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Words</span>
        <span class="stat-value" id="liveWords">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Chars</span>
        <span class="stat-value" id="liveChars">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Elapsed</span>
        <span class="stat-value" id="liveElapsed">00:00</span>
      </div>
    </div>

    <!-- Typing Area -->
    <div class="typing-area">
      <textarea id="typingArea"
        class="typing-textarea"
        placeholder="Start typing here..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        data-gramm="false"
        data-gramm_editor="false"
        data-enable-grammarly="false"
        disabled
      ></textarea>
    </div>

    <!-- Controls -->
    <div class="typing-controls" id="typingControls" style="display:none;">
      <button id="finishBtn2" class="btn btn-danger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Finish Test
      </button>
      <button id="restartBtn" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Restart
      </button>
    </div>
  </main>

  <!-- Pause Modal -->
  <div id="pauseModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Test Paused</h3>
      </div>
      <div class="modal-body">
        <p>Your test has been paused. Press <kbd>Esc</kbd> or click Resume to continue.</p>
      </div>
      <div class="modal-footer">
        <button id="resumeFromPause" class="btn btn-primary">Resume</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
